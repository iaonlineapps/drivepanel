<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icono de DrivePanel cuando se instala la WEB desde el navegador (verde y con globo),
       para no confundirlo con la app de Android (azul). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fc493"/>
      <stop offset="1" stop-color="#0a7a5c"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddf5ec"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M104 152c0-15.5 12.5-28 28-28h76c8.5 0 16.5 3.9 21.8 10.5L250 160h130c15.5 0 28 12.5 28 28v40H104z" fill="#a7e6d2"/>
  <rect x="104" y="196" width="304" height="196" rx="28" fill="url(#front)"/>
  <path d="M256 236l-58 58h38v58h40v-58h38z" fill="#0f9a73"/>
  <!-- globo: es la version web -->
  <circle cx="384" cy="368" r="62" fill="#0a6e52"/>
  <circle cx="384" cy="368" r="46" fill="#ffffff"/>
  <g fill="none" stroke="#0f9a73" stroke-width="7" stroke-linecap="round">
    <circle cx="384" cy="368" r="34"/>
    <ellipse cx="384" cy="368" rx="14" ry="34"/>
    <path d="M350 368h68M355 351h58M355 385h58"/>
