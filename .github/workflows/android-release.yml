# Publica la app de Android como Release (etiqueta android-vX.Y) cada vez que cambia
# android/dist/DrivePanel.apk en main. La version sale de android/src/main/AndroidManifest.xml.
# Usa la APK ya firmada, asi la clave de firma nunca tiene que estar en GitHub.
name: Publicar app Android

on:
  push:
    branches: [main]
    paths: ["android/dist/DrivePanel.apk"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear la Release con la APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -o 'versionName="[^"]*"' android/src/main/AndroidManifest.xml | cut -d'"' -f2)
          TAG="android-v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La Release $TAG ya existe: se cambia la APK por la nueva"
            gh release upload "$TAG" android/dist/DrivePanel.apk --clobber
            exit 0
          fi
          {
            echo "App de DrivePanel para Android. Descarga **DrivePanel.apk** aquí abajo (en *Assets*), ábrela en el móvil y toca **Instalar**. Si Android pregunta, permite instalar apps de este origen."
            echo
            echo "Si ya tienes una versión anterior, se instala encima sin perder nada."
            echo
            echo "## Novedades de la $V"
            awk -v v="## Versión $V" '$0==v{f=1;next} /^## /{f=0} f' android/src/main/res/raw/novedades.md
            echo
            echo "Necesita Android 7 o más nuevo. La primera vez pide la dirección de tu servidor (en casa, por ejemplo \`192.168.1.50:8090\`; fuera de casa, tu dirección pública)."
          } > notas.md
          cat notas.md
          gh release create "$TAG" android/dist/DrivePanel.apk --target "$GITHUB_SHA" \
            --title "App Android $V" --notes-file notas.md
